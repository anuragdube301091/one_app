<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ONE</title>
    <script>
      // GitHub Pages SPA redirect (spa-github-pages)
      // pathSegmentsToKeep = 1 because the site is served from /<repo>/
      // The repo segment must be stripped from the encoded path, otherwise
      // index.html re-prepends it and the URL accumulates /one_app/ forever.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.host +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
        '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
